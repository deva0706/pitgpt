[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitgpt"
version = "0.1.0"
description = "PitGPT — an offline Formula 1 race engineer built on SmolLM2-360M-Instruct + QLoRA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PitGPT" }]
keywords = ["llm", "qlora", "peft", "formula1", "smollm2", "fine-tuning"]

# Runtime dependencies are pinned loosely in requirements.txt so that the CUDA
# build of torch can be installed first. We intentionally leave them out of the
# hard install_requires here to avoid clobbering a hand-tuned GPU environment.
dependencies = []

[project.scripts]
# Thin console entry points mirroring scripts/. Optional but handy after install.
pitgpt-baseline = "pitgpt.inference.baseline:main"
pitgpt-chat = "pitgpt.app.gradio_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
